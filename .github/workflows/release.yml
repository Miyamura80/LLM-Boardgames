name: Release

# Cross-platform binary release for the `shbench` server/CLI.
#
# This is a functional baseline that builds `shbench` for each target and
# attaches archives to a GitHub Release. cargo-dist is adopted via
# `dist-workspace.toml`; running `dist init && dist generate ci` regenerates
# this file with the canonical cargo-dist pipeline (including the shell /
# PowerShell installers declared in that config).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases (e.g. v1.3.0-beta.1) — the whole tag must match.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build shbench
        # `--locked` pins the exact Cargo.lock deps so the released binary can't
        # silently diverge from the tested dependency set.
        run: cargo build --locked --release -p shbench --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "shbench-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" shbench

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/shbench.exe" `
            -DestinationPath "shbench-${{ matrix.target }}.zip"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Mark semver pre-release tags (e.g. v1.3.0-beta.1) as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            shbench-*.tar.gz
            shbench-*.zip
