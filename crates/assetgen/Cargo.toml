[package]
name = "assetgen"
version = "0.1.0"
edition = "2021"
description = "Gemini-backed logo/banner asset generator (dev tooling)"
license = "MIT"
publish = false

[[bin]]
name = "asset-gen"
path = "src/main.rs"

[dependencies]
app-config = { path = "../config" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", features = ["png", "ico", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
