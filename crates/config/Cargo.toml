[package]
name = "app-config"
version = "0.1.0"
edition = "2021"
description = "Application configuration (AppConfig/FrontendConfig) + loader – shared across transports"
license = "MIT"

[lib]
name = "app_config"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
config = { version = "0.15", features = ["yaml"] }

[dev-dependencies]
serial_test = "3"
serde_json = "1"
