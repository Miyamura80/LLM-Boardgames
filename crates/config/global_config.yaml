model_name: gemini/gemini-3-flash-preview
dot_global_config_health_check: true
dev_env: dev

example_parent:
  example_child: "example_value"

########################################################
# HTTP server (shbench serve)
########################################################
server:
  host: "127.0.0.1"
  port: 8080
  # HTTP request timeout in seconds (omit → 30s default).
  request_timeout_secs: 30
  # Allowed CORS origins. Empty = permissive (dev). In production, list the
  # exact frontend origins, e.g. ["https://app.example.com"].
  cors_allow_origins: []

########################################################
# LLMs
########################################################
default_llm:
  default_model: gemini/gemini-3-flash-preview
  fallback_model: gemini/gemini-2.5-flash-preview
  default_temperature: 0.5
  default_max_tokens: 100000

llm_config:
  cache_enabled: false
  retry:
    max_attempts: 3
    min_wait_seconds: 1
    max_wait_seconds: 5

########################################################
# Secret Hitler eval harness (see docs/rating-design.md)
########################################################
catan:
  retry_budget: 3
  action_cap: 12
  trade_windows_cap: 3
  say_cap: 2
  max_turns: 200
  utterance_char_cap: 240
  agent_max_tokens: 8192
  agent_temperature: 0.5
  rating_k: 2.0
  # Controlled mode seats 1 candidate + exactly 3 frozen anchors.
  pools:
    pool-a:
      - { name: random, kind: random-legal }
      - { name: greedy, kind: greedy }
      - { name: llm-cheap, kind: llm, model: openrouter/mistralai/mistral-small-3.1-24b-instruct }
  # Arena model sets: exactly 4 seat specs per set.
  model_sets:
    cheap:
      - openrouter/mistralai/mistral-small-3.1-24b-instruct
      - gemini/gemini-3-flash-preview
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/qwen/qwen3-32b

########################################################
# Codenames eval harness (see docs/PRD-codenames-evals.md)
########################################################
codenames:
  retry_budget: 3
  agent_max_tokens: 8192
  agent_temperature: 0.5
  rating_k: 2.0
  # Omit (or null) to use the vendored wordlist; set a path to override it.
  wordlist_path: null
  # Word vectors for the codenames-embedding anchor (GloVe/word2vec text
  # format). Null → that anchor kind is rejected at the game boundary.
  vectors_path: null
  clue_word_max_len: 20
  # Controlled mode seats 1 candidate + exactly 3 frozen anchors across the
  # four fixed seats (spymaster + operative per team).
  #
  # The shipped pool uses only anchors that work out of the box. The
  # codenames-embedding anchor is deliberately NOT here: it requires
  # vectors_path above, which ships null, so including it would make the
  # default controlled run fail at seat construction before a run row exists.
  # To use it, point vectors_path at a GloVe/word2vec text file and swap one
  # anchor for the commented line below.
  pools:
    pool-a:
      - { name: random-a, kind: codenames-random }
      - { name: random-b, kind: codenames-random }
      # - { name: embed, kind: codenames-embedding }   # needs vectors_path
      - { name: llm-cheap, kind: llm, model: openrouter/mistralai/mistral-small-3.1-24b-instruct }
  # Arena model sets: exactly 4 seat specs per set.
  model_sets:
    cheap:
      - openrouter/mistralai/mistral-small-3.1-24b-instruct
      - gemini/gemini-3-flash-preview
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/qwen/qwen3-32b

secret_hitler:
  discussion_rounds: 3
  retry_budget: 3
  utterance_char_cap: 240
  agent_max_tokens: 8192
  agent_temperature: 0.5
  rating_k: 2.0
  # Frozen anchor pools. The LLM anchors span three distinct model families
  # (Mistral / DeepSeek / Google) to avoid the same-family collusion caveat in
  # rating-design §3. Tiers are cheap per-token models: llm-cheap and llm-strong
  # are non-reasoning; llm-mid is DeepSeek V4 Pro (reasoning, but its tokens are
  # near-free so per-game cost stays low). This harness is output-volume-bound.
  # Routing is litellm-style: OpenAI / Anthropic
  # / Gemini use first-party keys; every other family routes through OpenRouter
  # (`openrouter/<org>/<model>`, one OPENROUTER_API_KEY). VERIFY the exact
  # slugs before a paid run — a wrong id surfaces as a transport error, not a
  # silent bad game.
  pools:
    pool-a:
      - { name: random, kind: random-legal }
      - { name: heuristic, kind: heuristic }
      - { name: bayes, kind: bayes-history }
      # llm-cheap: Mistral Small 3.2 — cheapest coherent non-reasoner (AA II 11).
      - { name: llm-cheap, kind: llm, model: openrouter/mistralai/mistral-small-3.2-24b-instruct }
      # llm-mid: DeepSeek V4 Pro — current DeepSeek flagship; reasoning but very cheap per-token.
      - { name: llm-mid, kind: llm, model: openrouter/deepseek/deepseek-v4-pro }
      # llm-strong: Gemini 3 Flash (non-reasoning) — fast, 1M ctx, first-party key.
      - name: llm-strong
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "Play a disciplined, analytical game. Track every vote and claim, reason aloud about deck probabilities, and build a consistent case before accusing."
    pool-b:
      - name: accuser
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "Be an aggressive accuser: pressure others early, demand explanations for every vote, and threaten to vote Nein unless people commit to positions."
      - name: quiet-bayesian
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "Speak rarely and briefly. When you do, cite concrete probabilities from the policy deck and voting record. Never emote."
      - name: deceiver
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "When Fascist, weave plausible false narratives and frame a Liberal each round. When Liberal, play mind-games to bait Fascists into contradictions."
      - name: coalition-builder
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "Build an explicit trust coalition: propose voting blocs, name who you trust and why, and try to lock in a stable government line."
      - name: contrarian
        kind: llm
        model: gemini/gemini-3-flash-preview
        persona: "Be sceptical of consensus: challenge whatever the table majority believes and float alternative suspect theories."
      - { name: bayes, kind: bayes-history }
  # Named arena model sets: `sh_run_match --mode arena --set <name>` seats all 7.
  # Each set is exactly 7 models so arena fills every seat with no duplicates.
  # These are frontier/reasoning-heavy leagues — expect high per-game cost; use
  # short runs (tens of games). Routing: OpenAI / Anthropic / Gemini first-party;
  # everything else via OpenRouter. VERIFY every slug against its provider before
  # a paid run (a wrong id fails loudly as a transport error).
  model_sets:
    frontier:
      - openai/gpt-5.5
      - openrouter/z-ai/glm-5.2
      - gemini/gemini-3.5-flash
      - openrouter/minimax/minimax-m3
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/x-ai/grok-4.3
      - anthropic/claude-opus-4-8
    cheap:
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/openai/gpt-oss-120b
      - openrouter/minimax/minimax-m3
      - openrouter/x-ai/grok-4.3
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b
      - openrouter/moonshotai/kimi-k2.6
      - openrouter/z-ai/glm-5.2

########################################################
# Debugging
########################################################
features:
  # Add feature flags here. Can be overridden by env vars: FEATURES__NEW_UI=true
  new_ui: false
  beta_features: false
  enable_llm_fallback: true

logging:
  verbose: false
  format:
    show_time: false
    show_session_id: true
    location:
      enabled: true
      show_file: true
      show_function: true
      show_line: true
      # Configure which log levels show location information
      show_for_info: false
      show_for_debug: true
      show_for_warning: true
      show_for_error: true
  levels:
    debug: false  # Suppress all debug logs
    info: true    # Show info logs
    warning: true # Show warning logs
    error: true   # Show error logs
    critical: true # Show critical logs
  redaction:
    enabled: true
    use_default_pii: true
    patterns:
      - name: "ANTHROPIC_API_KEY"
        regex: "sk-ant-[a-zA-Z0-9-]{20,}"
        placeholder: "[REDACTED_API_KEY]"
      - name: "OPENAI_API_KEY"
        regex: "sk-[a-zA-Z0-9]{20,}"
        placeholder: "[REDACTED_API_KEY]"
      - name: "STRIPE_API_KEY"
        regex: "[spr]k_(live|test)_[a-zA-Z0-9]{20,}"
        placeholder: "[REDACTED_API_KEY]"
      - name: "BEARER_TOKEN"
        regex: "Bearer\\s+[a-zA-Z0-9._\\-]{20,}"
        placeholder: "[REDACTED_BEARER_TOKEN]"
      - name: "GENERIC_KEY"
        regex: "(?i:(?:api[_-]?key|project[_-]?key|secret[_-]?key)[=:\\s]+['\"]?[a-zA-Z0-9_\\-]{16,}['\"]?)"
        placeholder: "[REDACTED_KEY]"
