[package]
name = "appctl"
version = "0.1.0"
edition = "2021"
description = "CLI + HTTP API harness for the Rust server template"
license = "MIT"

[[bin]]
name = "appctl"
path = "src/main.rs"

[features]
# The template ships with every surface enabled. `appctl init` prunes a surface
# by dropping its feature from this `default` list (via toml_edit), so a
# `cli-only` or `server-only` project compiles without the code it doesn't use.
default = ["cli", "http-api"]
# CLI diagnostic subcommands (doctor / call / probe / run-scenario).
cli = []
# The axum HTTP API (`appctl serve`) and its tower middleware stack. `app-config`
# is only read by the HTTP server, so a `cli-only` prune drops it too.
http-api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:app-config"]

[dependencies]
engine = { path = "../engine" }
app-config = { path = "../config", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "signal"] }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.12.0"
walkdir = "2"
toml_edit = "0.22"
comfy-table = "7"
anyhow = "1"

[dev-dependencies]
tempfile = "3.27.0"
